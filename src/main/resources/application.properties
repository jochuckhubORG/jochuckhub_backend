spring.application.name=jochuckhub

# Secrets are managed in application-private.properties (git-excluded)
spring.config.import=application-private.properties

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/jochuckhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# spring.datasource.password -> application-private.properties

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
jwt.expiration=900000
jwt.refresh-expiration=1209600000
# jwt.secret -> application-private.properties

# Kakao login is performed by the mobile Kakao SDK. The app sends its Kakao
# access token to POST /api/auth/kakao, and the backend validates it via Kakao API.

# CORS
cors.allowed-origins=http://localhost:3000
